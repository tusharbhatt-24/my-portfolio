    <text x="58" y="38" font-family="'IBM Plex Mono',monospace" font-size="22" fill="#2bf5b0">Available for opportunities</text>
  </g>

  <text x="96" y="560" font-family="'IBM Plex Mono',monospace" font-size="20" letter-spacing="3" fill="#51606f">github.com/tusharbhatt-24</text>
