<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030407"/>
      <stop offset="0.5" stop-color="#05070d"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#2bf5b0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2bf5b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#54c7ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#54c7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- hairline frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="20"/>

  <!-- logo mark -->
  <g transform="translate(96,150)">
    <rect width="86" height="86" rx="20" fill="none" stroke="#2bf5b0" stroke-width="2"/>
    <text x="43" y="58" font-family="'Space Grotesk',Arial,sans-serif" font-size="44" font-weight="700" fill="#eef3fb" text-anchor="middle">TB</text>
  </g>

  <text x="210" y="206" font-family="'IBM Plex Mono',monospace" font-size="22" letter-spacing="6" fill="#7e8a9b">FULL&#8209;STACK &#183; AI/ML ENGINEER</text>

  <text x="96" y="330" font-family="'Space Grotesk',Arial,sans-serif" font-size="92" font-weight="700" fill="#eef3fb">Tushar Bhatt</text>

  <text x="98" y="392" font-family="'Inter',Arial,sans-serif" font-size="30" fill="#7e8a9b">Building intelligent, fast, beautiful products.</text>

  <!-- accent pill -->
  <g transform="translate(98,440)">
    <rect width="380" height="60" rx="30" fill="rgba(43,245,176,0.08)" stroke="rgba(43,245,176,0.4)" stroke-width="1"/>
