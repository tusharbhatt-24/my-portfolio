<div id="loader">
  <!-- Deep space background layers -->
  <div class="ldr-stars"></div>
  <div class="ldr-aurora ldr-aurora-1"></div>
  <div class="ldr-aurora ldr-aurora-2"></div>
  <div class="ldr-aurora ldr-aurora-3"></div>

  <!-- Perspective grid floor -->
  <div class="ldr-grid-wrap">
    <div class="ldr-grid"></div>
    <div class="ldr-grid-fade"></div>
  </div>

  <!-- Main 3D canvas -->
  <canvas id="loader-canvas"></canvas>

  <!-- Corner HUD accents -->
  <div class="ldr-corner ldr-corner-tl">
    <div class="ldr-corner-h"></div><div class="ldr-corner-v"></div>
  </div>
  <div class="ldr-corner ldr-corner-tr">
    <div class="ldr-corner-h"></div><div class="ldr-corner-v"></div>
  </div>
  <div class="ldr-corner ldr-corner-bl">
    <div class="ldr-corner-h"></div><div class="ldr-corner-v"></div>
  </div>
  <div class="ldr-corner ldr-corner-br">
    <div class="ldr-corner-h"></div><div class="ldr-corner-v"></div>
  </div>

  <!-- Scan line -->
  <div class="ldr-scanline"></div>

  <!-- Central copy -->
  <div class="ldr-center">
    <!-- TB mark with glow ring -->
    <div class="ldr-logo-wrap">
      <div class="ldr-orbit-ring ldr-ring-1"></div>
      <div class="ldr-orbit-ring ldr-ring-2"></div>
      <div class="ldr-orbit-ring ldr-ring-3"></div>
      <div class="ldr-glow-halo"></div>
      <div class="loader-mark">TB</div>
    </div>

    <!-- Name -->
    <div id="loader-name">TUSHAR BHATT</div>

    <!-- AI status messages -->
    <div id="ldr-status">Initializing Neural Interface</div>

    <!-- Holographic progress bar -->
    <div class="ldr-holo-bar-wrap">
      <div class="ldr-holo-bar">
        <span id="loader-bar"></span>
        <div class="ldr-bar-glow"></div>
      </div>
      <div class="ldr-bar-ticks">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- Percentage + label row -->
    <div class="ldr-pct-row">
      <span class="ldr-sys-label">SYS_BOOT</span>
      <span id="loader-pct">0%</span>
      <span class="ldr-sys-label">V2.0.26</span>
    </div>
  </div>

  <!-- Side HUD data streams -->
  <div class="ldr-hud-left">
    <div class="ldr-hud-line">CPU_LOAD — <span class="ldr-hud-val">—</span></div>
    <div class="ldr-hud-line">MEM_USED — <span class="ldr-hud-val">—</span></div>
    <div class="ldr-hud-line">GPU_RENDER — <span class="ldr-hud-val">—</span></div>
    <div class="ldr-hud-line">NET_SYNC — <span class="ldr-hud-val">—</span></div>
  </div>
  <div class="ldr-hud-right">
    <div class="ldr-hud-line">LAT — <span class="ldr-hud-val">—</span></div>
    <div class="ldr-hud-line">FPS — <span class="ldr-hud-val">—</span></div>
    <div class="ldr-hud-line">BUF — <span class="ldr-hud-val">—</span></div>
    <div class="ldr-hud-line">ENV — <span class="ldr-hud-val">PROD</span></div>
  </div>
</div>
