    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      async function loadSections() {
        const sections = ['home', 'about', 'skills', 'work', 'certificates', 'contact'];
        const loaderPromise = fetch('sections/loading.html').then((res) => res.text());
        const sectionPromises = sections.map((s) =>
          fetch(`sections/${s}.html`).then((res) => res.text()),
        );

        document.getElementById('loader').innerHTML = await loaderPromise;
        const htmlSections = await Promise.all(sectionPromises);
        htmlSections.forEach((html, index) => {
          document.getElementById(sections[index]).innerHTML = html;
        });

        const script = document.createElement('script');
        script.src = 'script.js';
        script.async = false;
        document.body.appendChild(script);
      }
      loadSections();
    </script>
